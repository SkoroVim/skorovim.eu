<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkoroVim | Projekty</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♋</text></svg>">
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #030712; 
        }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    <iframe id="projectFrame" allowfullscreen></iframe>

    <script>
        function loadProject() {
            // Získáme text za mřížkou (např. z adresy #prvni vytáhne 'prvni')
            const project = window.location.hash.substring(1);
            const iframe = document.getElementById('projectFrame');

            if (project) {
                // Pokud adresa obsahuje hash, načteme konkrétní složku z Endory
                document.title = "SkoroVim | " + project;
                iframe.src = "https://69.8u.cz/prog2/" + project + "/";
            } else {
                // Pokud je adresa čistá, načteme rozcestník z adresáře tree
                document.title = "SkoroVim | Project Tree";
                iframe.src = "https://69.8u.cz/tree/";
            }
        }

        // Spustí kontrolu při načtení stránky
        loadProject();
        
        // Okamžitě reaguje na změnu hashe (např. při kliknutí na tlačítko Zpět v prohlížeči)
        window.addEventListener("hashchange", loadProject);
    </script>
</body>
</html>
